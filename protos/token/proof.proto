syntax = "proto3";

package token;

import "identity/id.proto";
import "realm/id.proto";
import "token/grant.proto";

// Proof is the identity, the realm it authenticated in, and the grant issued
// to it: what a completed authentication returns, and what is presented to
// exchange for a token.
message Proof {
  realm.ID realm_id = 1;
  identity.ID identity_id = 2;
  Grant grant = 3;
}
