syntax = "proto3";

package token;

import "identity/id.proto";
import "realm/mechanism/id.proto";
import "token/grant.proto";

// Proof is a grant, the identity it was issued to, and the realm mechanism the
// identity authenticated through.
message Proof {
  realm.mechanism.ID realm_mechanism_id = 1;
  identity.ID identity_id = 2;
  Grant grant = 3;
}
