syntax = "proto3";

package token;

import "google/protobuf/struct.proto";
import "identity/id.proto";
import "realm/id.proto";

// JWT is the claims of a token.
message JWT {
  // The realm the token was issued in.
  realm.ID realm_id = 1;

  // The identity the token was issued to.
  identity.ID identity_id = 2;

  // Who issued the token.
  string iss = 3;

  // When the token was issued.
  int64 iat = 4;

  // Who the token is intended for.
  repeated string aud = 5;

  // When the token becomes valid.
  optional int64 nbf = 6;

  // When the token stops being valid; unset when it never does.
  optional int64 exp = 7;

  // Every other claim the token carries.
  google.protobuf.Struct additional = 8;
}
