syntax = "proto3";

package token;

import "identity/id.proto";
import "realm/id.proto";

// JWT holds claims for encoding
message JWT {
  // Realm (JWT "realm_id") - the realm the subject is a member of
  realm.ID realm_id = 1;

  // Subject (JWT "sub") - the subject this token represents
  identity.ID identity_id = 2;

  // Issuer (JWT "iss") - who issued this token
  string iss = 3;

  // Issued at (JWT "iat") - Unix timestamp
  int64 iat = 4;

  // Audience (JWT "aud") - the intended recipient/resource server(s)
  repeated string aud = 5;

  // Not before (JWT "nbf") - Unix timestamp
  optional int64 nbf = 6;

  // Expiration time (JWT "exp") - Unix timestamp (unset = never expires)
  optional int64 exp = 7;
}
